name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'api.py'
      - 'routers/**'
      - 'core/**'
      - 'requirements.txt'
      - 'Dockerfile'
      - 'render.yaml'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-web.txt
          pip install pytest pytest-asyncio httpx

      - name: Run tests
        env:
          ENVIRONMENT: testing
          JWT_SECRET: test-secret
          SUPABASE_URL: https://test.supabase.co
          SUPABASE_ANON_KEY: test-anon-key
          SUPABASE_SERVICE_ROLE_KEY: test-service-key
        run: python -m pytest tests/ -v --tb=short --ignore=tests/test_vocabulary_screen.py --ignore=tests/test_reading_screen.py --ignore=tests/test_speaking_screen.py --ignore=tests/test_writing_screen.py --ignore=tests/test_dashboard_planner_integration.py --ignore=tests/test_grammar_screen.py --ignore=tests/test_mock_test_screen.py

      - name: Deploy to Render
        if: success()
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK secret is not set."
            echo "::notice::To enable automatic backend deployment:"
            echo "::notice::1. Create a Web Service on Render from this GitHub repo"
            echo "::notice::2. Use render.yaml blueprint or manual config:"
            echo "::notice::   Build: pip install -r requirements.txt"
            echo "::notice::   Start: uvicorn api:app --host 0.0.0.0 --port \$PORT"
            echo "::notice::3. Set environment variables in Render dashboard:"
            echo "::notice::   SUPABASE_URL, SUPABASE_ANON_KEY, SUPABASE_SERVICE_ROLE_KEY"
            echo "::notice::   JWT_SECRET, CORS_ORIGINS, ENVIRONMENT=production"
            echo "::notice::4. Copy the Deploy Hook URL from Render dashboard"
            echo "::notice::5. Add it as RENDER_DEPLOY_HOOK in GitHub Secrets"
            echo "::notice::Health check: GET /api/v1/health → 200"
            exit 0
          fi
          curl -X POST "$RENDER_DEPLOY_HOOK"
          echo "::notice::Deploy hook triggered. Check Render dashboard for build status."
