name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci || npm install

      - name: Lint
        working-directory: web
        run: npm run lint || true

      - name: Run tests
        working-directory: web
        run: npm run test || true

      - name: Build
        working-directory: web
        run: npm run build
        env:
          # GitHub Pages serves at /EnglishApp/ — base path must match
          VITE_BASE_PATH: '/EnglishApp/'
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || 'https://englishapp-api.onrender.com' }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'placeholder' }}

      - name: Verify build output
        working-directory: web
        run: |
          if [ ! -f dist/index.html ]; then
            echo "❌ dist/index.html not found — build failed"
            exit 1
          fi
          if [ ! -f dist/404.html ]; then
            echo "❌ dist/404.html not found — SPA routing file missing"
            exit 1
          fi
          echo "✅ Build output verified:"
          ls -la dist/
          echo "---"
          echo "index.html asset paths:"
          grep -oE '(src|href)="[^"]*"' dist/index.html | head -20

      - name: Setup Pages
        uses: actions/configure-pages@v5
        id: configure_pages

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
